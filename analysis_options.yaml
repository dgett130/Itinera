# Regole di analisi statica per Itinera.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # I TODO non bloccano l'analisi.
    todo: ignore
  exclude:
    # File generati (Drift, l10n): non analizzarli ne' applicarvi lint.
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "lib/l10n/app_localizations*.dart"
    - "lib/gen/**"

linter:
  rules:
    prefer_single_quotes: true
    prefer_final_locals: true
    require_trailing_commas: true
    unawaited_futures: true
