# Pipeline CI/CD Codemagic per Itinera.
#
# Nota: la versione di Flutter e' fissata a 3.38.5 perche' il progetto pinna
# versioni di pacchetti compatibili con Dart 3.10.4 (vedi pubspec.yaml e il
# workaround namespace in android/build.gradle.kts). Cambiando Flutter,
# riallineare i pin.

workflows:
  android:
    name: Itinera - Android
    max_build_duration: 60
    environment:
      flutter: 3.38.5
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Dipendenze
        script: flutter pub get
      - name: Codegen (Drift + l10n)
        script: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Analisi statica
        script: flutter analyze
      - name: Test
        script: flutter test --exclude-tags integration
      - name: Build APK (debug installabile) + AAB
        script: |
          flutter build apk --debug
          # Per la release firmata su Play serve un keystore (vedi Codemagic
          # code signing). Finche' non e' configurato, si distribuisce il debug.
          # flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab

  # Predisposizione iOS: build su agent macOS in cloud (nessun Mac locale).
  # Richiede Apple Developer Program e code signing configurati su Codemagic.
  ios:
    name: Itinera - iOS (TestFlight)
    max_build_duration: 90
    environment:
      flutter: 3.38.5
      xcode: latest
    triggering:
      events:
        - tag
    scripts:
      - name: Dipendenze
        script: flutter pub get
      - name: Codegen (Drift + l10n)
        script: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Test
        script: flutter test --exclude-tags integration
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
