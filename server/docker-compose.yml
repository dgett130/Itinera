services:
  itinera-server:
    build: .
    image: itinera-server:latest
    container_name: itinera-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # CAMBIARE in produzione. Le credenziali di default corrispondono a
      # quelle preimpostate nell'app.
      ITINERA_USERNAME: "dgett130"
      ITINERA_PASSWORD: "password"
      # Secret per firmare i token: metterne uno lungo e casuale.
      ITINERA_SECRET: "cambia-questo-secret-con-una-stringa-lunga-e-casuale"
      ITINERA_DATA_DIR: "/data"
      ITINERA_TOKEN_TTL_DAYS: "30"
    volumes:
      - itinera-data:/data

volumes:
  itinera-data:
